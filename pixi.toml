[workspace]
name = "orinoco-lite-submodule-demo"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[dependencies]
python = ">=3.12,<3.13"
copier = "==9.10.3"
hugo = "==0.154.5"
pyyaml = "==6.0.2"

[pypi-dependencies]
orinoco-lite = { git = "https://github.com/ORINOCO-Lite/orinoco-lite-dev.git", rev = "8ca7845925de6236a97bd7270aab13cb9a22e070" }
datalad = ">=1.6.2,<2"

[tasks]
build = "orinoco-lite build --destination build/site --base-url /"
build-pages = "orinoco-lite build --destination build/pages --publication-bundle build/pages-publication.bundle"
serve = "orinoco-lite serve --directory build/site --port 8765"
