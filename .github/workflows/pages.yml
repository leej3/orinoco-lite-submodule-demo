name: Publish authentication test Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Preserve the existing public website while its metadata is private.
      # This fixture tests authentication, not the unfinished website build.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-pages
          run-id: 41536431359
          github-token: ${{ github.token }}
          path: previous-pages
      - run: |
          mkdir -p build/pages
          tar -xf previous-pages/artifact.tar -C build/pages
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORINOCO-Lite/orinoco-lite-dev
          ref: ebcebda61b7a9382fe83b5c7dcaec86774c27cc3
          path: auth-package
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.23.2"
      - name: Build the disposable authentication probe
        env:
          ORINOCO_PROBE_SOURCE: ${{ github.sha }}
        run: |
          npm ci --prefix auth-package/packages/curation-review-app
          npm exec --prefix auth-package/packages/curation-review-app -- vite build --config "$GITHUB_WORKSPACE/probe/vite.config.mjs"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        id: deployment
